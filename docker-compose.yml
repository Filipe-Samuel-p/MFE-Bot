services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mfebot
      POSTGRES_USER: mfebot
      POSTGRES_PASSWORD: mfebot
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfebot -d mfebot"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: inference/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mfebot
      DB_USER: mfebot
      DB_PASSWORD: mfebot
    volumes:
      - ./data:/app/data:ro
      - ./inference/models:/app/inference/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mfebot
      DB_USER: mfebot
      DB_PASSWORD: mfebot
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
